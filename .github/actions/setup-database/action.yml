name: Setup database
description: Starts the MySQL server that autofix and the tests run against.

runs:
  using: composite
  steps:
    - name: Start MySQL
      shell: bash
      run: |
        docker run --detach --name mysql --publish 3306:3306 \
          --env MYSQL_ALLOW_EMPTY_PASSWORD=yes mysql:8.4

        # The image initializes the database with a temporary server that doesn't listen on
        # TCP, then restarts it, so wait until the final server accepts TCP connections.
        timeout 120 bash -c 'until docker exec mysql mysqladmin ping --host 127.0.0.1 --silent; do sleep 1; done'
