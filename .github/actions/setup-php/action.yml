name: Setup PHP
description: Installs the PHP version and extensions that autofix, Larastan and the tests run on.

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
      with:
        php-version: '8.4'
        extensions: pdo_pgsql
        tools: composer:v2
        coverage: none
