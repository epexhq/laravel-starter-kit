version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      composer:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    # vite is an npm: alias of vite-plus-core that Dependabot can't update, so a vite-plus update
    # needs the alias and the override in package.json changed by hand. Its own group keeps that
    # from blocking the other npm updates.
    groups:
      vite-plus:
        patterns:
          - "vite"
          - "vite-plus"
      npm:
        patterns:
          - "*"
