name: autofix

on:
  workflow_call:
    inputs:
      fix:
        description: Commit and push the changes (true), or fail when anything would change (false).
        type: boolean
        required: true
    outputs:
      sha:
        description: The commit autofix pushed, or empty when nothing changed or fix is false.
        value: ${{ jobs.autofix.outputs.sha }}

jobs:
  autofix:
    name: Rector, IDE Helper and Pint
    runs-on: ubuntu-latest

    outputs:
      sha: ${{ steps.commit.outputs.sha }}

    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: ${{ inputs.fix }}

      - name: Start the database
        uses: ./.github/actions/setup-database

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Rector
        run: composer ${{ inputs.fix && 'refactor' || 'refactor:check' }}

      # IDE Helper reads the model columns from the migrated database.
      - name: Migrate database
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: IDE Helper
        run: composer ide-helper

      - name: Pint
        run: composer ${{ inputs.fix && 'lint' || 'lint:check' }}

      - name: Check IDE Helper output
        if: ${{ !inputs.fix }}
        run: |
          if ! git diff --exit-code -- _ide_helper_models.php; then
            echo "::error file=_ide_helper_models.php::_ide_helper_models.php is out of date. Run composer ide-helper and commit the result."
            exit 1
          fi

      - name: Commit fixes
        id: commit
        if: ${{ inputs.fix }}
        run: |
          git add --all

          if git diff --cached --quiet; then
            echo "Rector, IDE Helper and Pint made no changes."
            exit 0
          fi

          git diff --cached --stat

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet --message 'Apply Rector, IDE Helper and Pint fixes'
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
