name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# On pull requests from branches of this repository, except Dependabot's, autofix applies Rector,
# IDE Helper and Pint, commits any change and pushes it to the branch. Pushes to main, pull
# requests from forks and Dependabot's pull requests, whose new dependencies shouldn't run with a
# write token, run the same tools in check mode instead, which fail when anything would change.
#
# Larastan, the tests and the frontend build then run on the code autofix produced: its commit
# when it pushed one, otherwise the commit that triggered this run. A push made with
# GITHUB_TOKEN starts no new run on its own (on a pull request GitHub only queues one that
# waits for approval), and a rerun finds nothing to fix, so autofix cannot loop.
jobs:
  autofix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    uses: ./.github/workflows/autofix.yml
    with:
      fix: true
    permissions:
      contents: write

  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]'
    uses: ./.github/workflows/autofix.yml
    with:
      fix: false

  larastan:
    needs: [autofix, check]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/larastan.yml
    with:
      ref: ${{ needs.autofix.outputs.sha }}

  tests:
    needs: [autofix, check]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.autofix.outputs.sha }}

  build:
    needs: [autofix, check]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.autofix.outputs.sha }}
