name: larastan

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to analyse; empty means the commit that triggered the run.
        type: string
        default: ''

jobs:
  larastan:
    name: Larastan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Larastan
        run: |
          git log -1 --format='Analysing %H %s'
          composer types:check
