name: larastan

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to analyse; empty means the commit that triggered the run.
        type: string
        default: ''

jobs:
  larastan:
    name: Larastan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      # Flux Pro is installed from composer.fluxui.dev with the license in the repository secrets.
      COMPOSER_AUTH: '{"http-basic":{"composer.fluxui.dev":{"username":"${{ secrets.FLUX_USERNAME }}","password":"${{ secrets.FLUX_LICENSE_KEY }}"}}}'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Larastan
        run: |
          git log -1 --format='Analysing %H %s'
          composer types:check
