name: tests

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to test; empty means the commit that triggered the run.
        type: string
        default: ''

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Start the database
        uses: ./.github/actions/setup-database

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      # The tests need no frontend build (withoutVite() in tests/TestCase.php; build.yml checks it), only their database.
      - name: Setup Application
        run: |
          cp .env.example .env
          php artisan key:generate
          composer setup:test-database

      - name: Run tests
        run: |
          git log -1 --format='Testing %H %s'
          ./vendor/bin/pest --parallel
