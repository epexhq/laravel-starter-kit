services:
  postgres:
    command: exec /usr/lib/postgresql/18/bin/postgres -D "$HOME/.local/share/postgresql"
    port: 5432
  valkey:
    command: exec valkey-server --bind 127.0.0.1 --port 6379 --save '' --appendonly no
    port: 6379
  mailpit:
    command: exec mailpit --listen "127.0.0.1:$PORT" --smtp 127.0.0.1:1025
    portal:
      title: Mailpit
    review: false
  s3:
    command: exec versitygw --port 127.0.0.1:9000 posix --nometa "$HOME/.local/share/s3"
    port: 9000
    env:
      ROOT_ACCESS_KEY_ID: orb
      ROOT_SECRET_ACCESS_KEY: orb-secret
